<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Evaluator</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <header>
        <h1>Score Evaluator</h1>
    </header>

    <main>
        <section class="intro">
            <h2>Welcome to the Score Evaluator!</h2>
            <p>
                This program evaluates a student's score
                and displays the corresponding remark.
            </p>

            <button onclick="btnfunction()" id="startBtn">Start Evaluation</button>
        </section>

        <section class="result-section">
            <h2>Evaluation Result</h2>

            <div id="result">
                <p>Your result will appear here.</p>
            </div>
        </section>

        <section class="grading">
            <h2>Grading System</h2>

            <table>
                <thead>
                    <tr>
                        <th>Score</th>
                        <th>Remark</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>90–100</td>
                        <td>Excellent</td>
                    </tr>

                    <tr>
                        <td>75–89</td>
                        <td>Passed</td>
                    </tr>

                    <tr>
                        <td>Below 75</td>
                        <td>Failed</td>
                    </tr>

                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Group 12 - Laboratory Activity 1</p>
    </footer>

    <script src="script/script.js"></script>
</body>
</html>
